# ============================================================================
# ALLOWED PORTS & SOURCES CONFIGURATION
# ============================================================================
# This file defines whitelist rules for network ports and their permitted sources.
# The system follows a WHITELIST MODEL: if a port has no rule, it's "BLOCKED".
#
# RULE STRUCTURE:
#   port:           Destination port number (1-65535)
#   protocol:       "tcp" or "udp"
#   description:    Human-readable label
#   allowed_sources: List of permitted source IPs/subnets
#
# SOURCE TYPES:
#   - subnet:    CIDR notation (192.168.0.0/16 = 192.168.0.0 to 192.168.255.255)
#   - ip:        Single exact IP (203.0.113.50 = only this address)
#   - localhost: Local machine (127.0.0.1 or ::1)
#   - any:       All sources (0.0.0.0/0 = any IPv4)
#
# CIDR NOTATION:
#   /8   = 256 addresses          (e.g., 10.0.0.0/8)
#   /16  = 65,536 addresses       (e.g., 192.168.0.0/16)
#   /24  = 256 addresses          (e.g., 192.168.1.0/24)
#   /32  = 1 address (exact IP)   (e.g., 203.0.113.50/32)
#
# EXAMPLES OF COMMON NETWORKS:
#   Class A Private:    10.0.0.0/8          (10.0.0.0 - 10.255.255.255)
#   Class B Private:    172.16.0.0/12       (172.16.0.0 - 172.31.255.255)
#   Class C Private:    192.168.0.0/16      (192.168.0.0 - 192.168.255.255)
#   Localhost:          127.0.0.1 or ::1    (only this machine)
#   Public (any):       0.0.0.0/0           (entire internet)
#
# ============================================================================

rules:

  # ──────────────────────────────────────────────────────────────────────
  # SSH
  # ──────────────────────────────────────────────────────────────────────
  - port: 22
    protocol: tcp
    description: "SSH - Local only"
    allowed_sources:
      - type: subnet
        value: "192.168.0.0/16"
      - type: subnet
        value: "10.0.0.0/8"
      - type: localhost
        value: "127.0.0.1"

  # ──────────────────────────────────────────────────────────────────────
  # HTTP - Hypertext Transfer Protocol (Web Traffic)
  # ──────────────────────────────────────────────────────────────────────
  - port: 80
    protocol: tcp
    description: "HTTP - Public"
    allowed_sources:
      - type: any                    
        value: "0.0.0.0/0"


  # ──────────────────────────────────────────────────────────────────────
  # HTTPS - Hypertext Transfer Protocol Secure
  # ──────────────────────────────────────────────────────────────────────
  - port: 443
    protocol: tcp
    description: "HTTPS - Public"
    allowed_sources:
      - type: any                    
        value: "0.0.0.0/0"