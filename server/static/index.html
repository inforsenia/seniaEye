<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Monitor de Agentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0b0e13;
    --surface:  #111620;
    --border:   #1e2a3a;
    --accent:   #00d4ff;
    --accent2:  #ff6b35;
    --green:    #00ff88;
    --red:      #ff3e5e;
    --yellow:   #ffd166;
    --text:     #c8d8e8;
    --muted:    #4a6070;
    --mono:     'Share Tech Mono', monospace;
    --sans:     'Barlow', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }
  .logo {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .logo span { color: var(--muted); }

  .header-stats {
    display: flex;
    gap: 32px;
    align-items: center;
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .stat-pill .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  .dot.green { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.red   { background: var(--red);   box-shadow: 0 0 8px var(--red); }
  .dot.blue  { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.4; }
  }

  .ws-status {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 2px;
    border: 1px solid currentColor;
  }
  .ws-status.connected    { color: var(--green); }
  .ws-status.disconnected { color: var(--red); }
  .ws-status.connecting   { color: var(--yellow); }

  /* ── LAYOUT ── */
  .body-wrap {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  aside {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .aside-title {
    padding: 14px 16px 10px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .agent-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .agent-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    font-size: 13px;
  }
  .agent-item:hover     { background: rgba(0,212,255,0.05); }
  .agent-item.active    { border-left-color: var(--accent); background: rgba(0,212,255,0.08); color: var(--accent); }
  .agent-item.selected  { border-left-color: var(--accent2); background: rgba(255,107,53,0.08); color: var(--accent2); }
  .agent-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .agent-dot.online  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .agent-dot.offline { background: var(--muted); }
  .agent-id {
    font-family: var(--mono);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .agent-count {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    background: var(--bg);
    padding: 1px 5px;
    border-radius: 2px;
  }

  .aside-filter {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }
  .aside-filter button {
    width: 100%;
    padding: 7px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }
  .aside-filter button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .aside-filter button.active-filter {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(255,107,53,0.08);
  }

  /* ── MAIN ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }
  .search-box {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 6px 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box::placeholder { color: var(--muted); }
  .search-box:focus { border-color: var(--accent); }

  .toolbar-btn {
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .toolbar-btn:hover  { border-color: var(--accent); color: var(--accent); }
  .toolbar-btn.danger:hover { border-color: var(--red); color: var(--red); }

  .event-count-badge {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ── TABLE ── */
  .table-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  thead tr {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
  }
  th {
    padding: 10px 16px;
    text-align: left;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--accent); }

  tbody tr {
    border-bottom: 1px solid rgba(30,42,58,0.5);
    transition: background 0.1s;
    animation: rowIn 0.25s ease both;
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  tbody tr:hover { background: rgba(0,212,255,0.04); }
  tbody tr.new-row { background: rgba(0,212,255,0.07); }

  td {
    padding: 8px 16px;
    vertical-align: top;
    font-family: var(--mono);
    font-size: 12px;
  }
  td.col-ts    { color: var(--muted); white-space: nowrap; width: 160px; }
  td.col-agent { width: 140px; }
  td.col-data  { word-break: break-all; }
  td.col-type  { width: 120px; }

  .agent-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 2px;
    font-size: 11px;
    border: 1px solid;
  }

  .type-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 2px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .type-event            { background: rgba(0,212,255,0.1);  color: var(--accent);  border: 1px solid rgba(0,212,255,0.2); }
  .type-agent_connected  { background: rgba(0,255,136,0.1);  color: var(--green);   border: 1px solid rgba(0,255,136,0.2); }
  .type-agent_disconnected{background: rgba(255,62,94,0.1);  color: var(--red);     border: 1px solid rgba(255,62,94,0.2); }
  .type-command_ack      { background: rgba(255,209,102,0.1);color: var(--yellow);  border: 1px solid rgba(255,209,102,0.2);}

  .data-cell {
    color: var(--text);
    opacity: 0.85;
    line-height: 1.5;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--muted);
  }
  .empty-state .icon {
    font-size: 40px;
    opacity: 0.3;
  }
  .empty-state p {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 2px;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* ── TOAST ── */
  .toast-container {
    position: fixed;
    bottom: 20px; right: 20px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 999;
  }
  .toast {
    padding: 10px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    border-radius: 2px;
    animation: toastIn 0.2s ease, toastOut 0.3s ease 2.7s both;
  }
  .toast.error { border-left-color: var(--red); }
  .toast.success { border-left-color: var(--green); }
  @keyframes toastIn  { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes toastOut { to   { opacity:0; transform:translateY(10px); } }

  /* ── GRID SCAN LINE ── */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
    pointer-events: none;
    z-index: 0;
  }
  header, aside, main, .toast-container { position: relative; z-index: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">SYS<span>::</span>MONITOR <span style="font-size:10px;color:var(--muted);">v1.0</span></div>
  <div class="header-stats">
    <div class="stat-pill"><div class="dot green" id="dot-online"></div><span id="agents-online">0</span>&nbsp;ONLINE</div>
    <div class="stat-pill"><div class="dot blue"></div><span id="total-events">0</span>&nbsp;EVENTOS</div>
    <div class="ws-status connecting" id="ws-status">CONECTANDO...</div>
  </div>
</header>

<div class="body-wrap">
  <aside>
    <div class="aside-title">Agentes</div>
    <div class="agent-list" id="agent-list">
      <div style="padding:20px 16px;color:var(--muted);font-family:var(--mono);font-size:11px;">Sin agentes</div>
    </div>
    <div class="aside-filter">
      <button id="btn-filter-selected" onclick="toggleFilterSelected()">FILTRAR SELECCIONADO</button>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <input class="search-box" id="search-input" type="text" placeholder="Buscar en logs... (agente, tipo, datos)" oninput="applyFilters()">
      <button class="toolbar-btn" onclick="scrollToBottom()">↓ IR AL FINAL</button>
      <button class="toolbar-btn" onclick="toggleAutoScroll()" id="btn-autoscroll">AUTO-SCROLL: ON</button>
      <button class="toolbar-btn danger" onclick="clearLog()">LIMPIAR</button>
      <div class="event-count-badge" id="event-count-badge">0 / 0 eventos</div>
    </div>
    <div class="table-wrap" id="table-wrap">
      <div class="empty-state" id="empty-state">
        <div class="icon">◈</div>
        <p>ESPERANDO EVENTOS...</p>
      </div>
      <table id="log-table" style="display:none">
        <thead>
          <tr>
            <th>TIMESTAMP</th>
            <th>AGENTE</th>
            <th>TIPO</th>
            <th>DATOS</th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ── Estado ──────────────────────────────────────────────────────────────────
const state = {
  ws: null,
  agents: {},           // agent_id → { online, count, color }
  allEvents: [],        // todos los eventos
  filteredEvents: [],   // eventos tras filtros
  selectedAgent: null,  // agente seleccionado para filtrar
  filterSelected: false,
  searchQuery: '',
  autoScroll: true,
  maxEvents: 2000,
};

const COLORS = [
  '#00d4ff','#ff6b35','#00ff88','#ffd166','#c77dff',
  '#ff9f1c','#06d6a0','#ef476f','#118ab2','#f4a261'
];
let colorIdx = 0;

// ── WebSocket ────────────────────────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  state.ws = new WebSocket(`${proto}://${location.host}/ws/dashboard`);

  state.ws.onopen = () => {
    setWsStatus('connected', 'CONECTADO');
    toast('Dashboard conectado al servidor', 'success');
  };

  state.ws.onclose = () => {
    setWsStatus('disconnected', 'DESCONECTADO');
    toast('Conexión perdida. Reconectando...', 'error');
    setTimeout(connect, 3000);
  };

  state.ws.onerror = () => setWsStatus('disconnected', 'ERROR');

  state.ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleMessage(msg);
  };
}

function handleMessage(msg) {
  if (msg.type === 'snapshot') {
    // Estado inicial
    msg.agents.forEach(id => ensureAgent(id, true));
    msg.events.forEach(ev => addEvent(ev, false));
    applyFilters();
    renderAgentList();
    return;
  }

  if (msg.type === 'agent_connected') {
    ensureAgent(msg.agent_id, true);
    addEvent(msg, true);
    renderAgentList();
    updateStats();
    toast(`Agente conectado: ${msg.agent_id}`, 'success');
    return;
  }

  if (msg.type === 'agent_disconnected') {
    if (state.agents[msg.agent_id]) {
      state.agents[msg.agent_id].online = false;
    }
    addEvent(msg, true);
    renderAgentList();
    updateStats();
    toast(`Agente desconectado: ${msg.agent_id}`, 'error');
    return;
  }

  if (msg.type === 'event') {
    ensureAgent(msg.agent_id, true);
    addEvent(msg, true);
    return;
  }

  if (msg.type === 'command_ack') {
    addEvent(msg, true);
    const s = msg.success ? 'enviado' : 'falló (agente no disponible)';
    toast(`Comando a ${msg.agent_id}: ${s}`, msg.success ? 'success' : 'error');
    return;
  }
}

// ── Agentes ──────────────────────────────────────────────────────────────────
function ensureAgent(id, online) {
  if (!state.agents[id]) {
    state.agents[id] = { online, count: 0, color: COLORS[colorIdx++ % COLORS.length] };
  } else {
    state.agents[id].online = online;
  }
}

function renderAgentList() {
  const el = document.getElementById('agent-list');
  const ids = Object.keys(state.agents);
  if (!ids.length) {
    el.innerHTML = '<div style="padding:20px 16px;color:var(--muted);font-family:var(--mono);font-size:11px;">Sin agentes</div>';
    return;
  }
  el.innerHTML = ids.map(id => {
    const ag = state.agents[id];
    const isSelected = state.selectedAgent === id;
    const cls = ag.online ? 'active' : '';
    const selCls = isSelected ? 'selected' : '';
    return `
      <div class="agent-item ${cls} ${selCls}" onclick="selectAgent('${id}')">
        <div class="agent-dot ${ag.online ? 'online' : 'offline'}"></div>
        <span class="agent-id">${id}</span>
        <span class="agent-count">${ag.count}</span>
      </div>`;
  }).join('');
  updateStats();
}

function selectAgent(id) {
  state.selectedAgent = state.selectedAgent === id ? null : id;
  if (!state.selectedAgent) state.filterSelected = false;
  renderAgentList();
  applyFilters();
}

function toggleFilterSelected() {
  if (!state.selectedAgent) { toast('Selecciona primero un agente', ''); return; }
  state.filterSelected = !state.filterSelected;
  document.getElementById('btn-filter-selected').classList.toggle('active-filter', state.filterSelected);
  applyFilters();
}

// ── Eventos ──────────────────────────────────────────────────────────────────
function addEvent(ev, live) {
  if (state.agents[ev.agent_id]) state.agents[ev.agent_id].count++;
  state.allEvents.push(ev);
  if (state.allEvents.length > state.maxEvents) {
    state.allEvents.splice(0, 200);
  }

  if (live) {
    // Solo añadir fila si pasa filtros actuales
    const passes = eventPassesFilter(ev);
    if (passes) {
      state.filteredEvents.push(ev);
      appendRow(ev, true);
      updateCountBadge();
    }
    if (state.autoScroll) scrollToBottom();
  }
}

function eventPassesFilter(ev) {
  if (state.filterSelected && state.selectedAgent && ev.agent_id !== state.selectedAgent) return false;
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    const haystack = JSON.stringify(ev).toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  return true;
}

function applyFilters() {
  state.filteredEvents = state.allEvents.filter(eventPassesFilter);
  rebuildTable();
}

function rebuildTable() {
  const tbody = document.getElementById('log-body');
  const empty = document.getElementById('empty-state');
  const table = document.getElementById('log-table');

  tbody.innerHTML = '';
  if (!state.filteredEvents.length) {
    empty.style.display = 'flex';
    table.style.display = 'none';
  } else {
    empty.style.display = 'none';
    table.style.display = '';
    state.filteredEvents.forEach(ev => appendRow(ev, false));
  }
  updateCountBadge();
  if (state.autoScroll) scrollToBottom();
}

function appendRow(ev, animate) {
  const empty = document.getElementById('empty-state');
  const table = document.getElementById('log-table');
  empty.style.display = 'none';
  table.style.display = '';

  const tbody = document.getElementById('log-body');
  const tr = document.createElement('tr');
  if (animate) tr.classList.add('new-row');

  const color = state.agents[ev.agent_id]?.color || '#888';
  const typeClass = `type-${ev.type}`;
  const dataStr = ev.type === 'event'
    ? formatData(ev.data)
    : (ev.type === 'command_ack' ? `success: ${ev.success}` : '');

  tr.innerHTML = `
    <td class="col-ts">${ev.timestamp || '—'}</td>
    <td class="col-agent">
      <span class="agent-badge" style="color:${color};border-color:${color}30;background:${color}10">${ev.agent_id || '—'}</span>
    </td>
    <td class="col-type"><span class="type-badge ${typeClass}">${ev.type}</span></td>
    <td class="col-data"><span class="data-cell">${dataStr}</span></td>`;

  tbody.appendChild(tr);

  if (animate) {
    setTimeout(() => tr.classList.remove('new-row'), 600);
  }
}

function formatData(data) {
  if (!data) return '—';
  if (typeof data === 'string') return escHtml(data);
  return escHtml(JSON.stringify(data));
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function setWsStatus(cls, text) {
  const el = document.getElementById('ws-status');
  el.className = `ws-status ${cls}`;
  el.textContent = text;
}

function updateStats() {
  const online = Object.values(state.agents).filter(a => a.online).length;
  document.getElementById('agents-online').textContent = online;
  document.getElementById('total-events').textContent = state.allEvents.length;
}

function updateCountBadge() {
  document.getElementById('event-count-badge').textContent =
    `${state.filteredEvents.length} / ${state.allEvents.length} eventos`;
  updateStats();
}

function scrollToBottom() {
  const wrap = document.getElementById('table-wrap');
  wrap.scrollTop = wrap.scrollHeight;
}

let autoScrollPaused = false;
function toggleAutoScroll() {
  state.autoScroll = !state.autoScroll;
  document.getElementById('btn-autoscroll').textContent = `AUTO-SCROLL: ${state.autoScroll ? 'ON' : 'OFF'}`;
}

function clearLog() {
  state.allEvents = [];
  state.filteredEvents = [];
  Object.values(state.agents).forEach(a => a.count = 0);
  rebuildTable();
  renderAgentList();
  updateCountBadge();
}

document.getElementById('search-input').addEventListener('input', (e) => {
  state.searchQuery = e.target.value;
  applyFilters();
});

// Pause auto-scroll when user scrolls up manually
document.getElementById('table-wrap').addEventListener('scroll', (e) => {
  const el = e.target;
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  if (!atBottom && state.autoScroll) {
    // don't change state, user is reading
  }
});

function toast(msg, type = '') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

// ── Init ──────────────────────────────────────────────────────────────────────
connect();
</script>
</body>
</html>
