<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Monitor de Agentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0b0e13;
    --surface: #111620;
    --border:  #1e2a3a;
    --accent:  #00d4ff;
    --accent2: #ff6b35;
    --green:   #00ff88;
    --red:     #ff3e5e;
    --yellow:  #ffd166;
    --text:    #c8d8e8;
    --muted:   #4a6070;
    --mono:    'Share Tech Mono', monospace;
    --sans:    'Barlow', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); min-height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
    pointer-events: none; z-index: 0;
  }
  header, aside, main, .toast-container { position: relative; z-index: 1; }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; height: 56px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0; position: relative;
  }
  header::after {
    content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
    height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.4;
  }
  .logo { font-family: var(--mono); font-size: 15px; color: var(--accent); letter-spacing: 3px; }
  .logo span { color: var(--muted); }
  .header-stats { display: flex; gap: 28px; align-items: center; }
  .stat-pill { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
  .dot.green  { background: var(--green);  box-shadow: 0 0 8px var(--green); }
  .dot.blue   { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .ws-status { font-family: var(--mono); font-size: 11px; padding: 3px 10px; border-radius: 2px; border: 1px solid currentColor; }
  .ws-status.connected    { color: var(--green); }
  .ws-status.disconnected { color: var(--red); }
  .ws-status.connecting   { color: var(--yellow); }

  /* ── LAYOUT ── */
  .body-wrap { display: flex; flex: 1; overflow: hidden; }

  /* ── SIDEBAR ── */
  aside {
    width: 240px; flex-shrink: 0;
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .aside-title {
    padding: 14px 16px 10px; font-size: 10px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .agent-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .agent-item {
    padding: 8px 14px; cursor: pointer;
    border-left: 3px solid transparent; transition: all 0.15s;
    border-bottom: 1px solid rgba(30,42,58,0.4);
  }
  .agent-item:hover { background: rgba(0,212,255,0.05); }
  .agent-item.selected { border-left-color: var(--accent2); background: rgba(255,107,53,0.07); }

  .agent-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .agent-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .agent-dot.online  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .agent-dot.offline { background: var(--muted); }
  .agent-id { font-family: var(--mono); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-evcount { font-family: var(--mono); font-size: 10px; color: var(--muted); }

  /* Estado del agente */
  .agent-status-bar {
    display: flex; gap: 4px; margin-bottom: 6px;
  }
  .status-badge {
    font-family: var(--mono); font-size: 10px; letter-spacing: 1px;
    padding: 2px 7px; border-radius: 2px; border: 1px solid;
    text-transform: uppercase;
  }
  .status-badge.waiting    { color: var(--yellow); border-color: rgba(255,209,102,0.3); background: rgba(255,209,102,0.08); }
  .status-badge.monitoring { color: var(--green);  border-color: rgba(0,255,136,0.3);   background: rgba(0,255,136,0.08); }
  .status-badge.offline    { color: var(--muted);  border-color: rgba(74,96,112,0.3);   background: transparent; }

  /* Botones por agente */
  .agent-btns { display: flex; gap: 4px; }
  .agent-btn {
    flex: 1; padding: 4px 0; font-family: var(--mono); font-size: 10px;
    letter-spacing: 1px; border: 1px solid; border-radius: 2px;
    cursor: pointer; transition: all 0.15s; background: transparent;
    text-transform: uppercase;
  }
  .agent-btn.start { color: var(--green); border-color: rgba(0,255,136,0.3); }
  .agent-btn.start:hover { background: rgba(0,255,136,0.12); }
  .agent-btn.stop  { color: var(--red);   border-color: rgba(255,62,94,0.3); }
  .agent-btn.stop:hover  { background: rgba(255,62,94,0.12); }
  .agent-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Panel inferior sidebar — broadcast */
  .broadcast-panel {
    border-top: 1px solid var(--border); padding: 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .broadcast-title {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 2px;
  }
  .broadcast-btn {
    width: 100%; padding: 7px; font-family: var(--mono); font-size: 11px;
    letter-spacing: 1px; text-transform: uppercase; border-radius: 2px;
    cursor: pointer; transition: all 0.15s; border: 1px solid;
    background: transparent;
  }
  .broadcast-btn.all-start { color: var(--green); border-color: rgba(0,255,136,0.4); }
  .broadcast-btn.all-start:hover { background: rgba(0,255,136,0.1); }
  .broadcast-btn.all-stop  { color: var(--red);   border-color: rgba(255,62,94,0.4); }
  .broadcast-btn.all-stop:hover  { background: rgba(255,62,94,0.1); }
  .filter-btn {
    width: 100%; padding: 6px; font-family: var(--mono); font-size: 11px;
    letter-spacing: 1px; text-transform: uppercase; border-radius: 2px;
    cursor: pointer; transition: all 0.15s; border: 1px solid var(--border);
    background: transparent; color: var(--muted);
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(255,107,53,0.08); }

  /* ── MAIN ── */
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .toolbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--surface);
  }
  .search-box {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 2px; padding: 6px 12px; color: var(--text);
    font-family: var(--mono); font-size: 12px; outline: none; transition: border-color 0.2s;
  }
  .search-box::placeholder { color: var(--muted); }
  .search-box:focus { border-color: var(--accent); }
  .toolbar-btn {
    padding: 6px 12px; background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-family: var(--mono); font-size: 11px;
    letter-spacing: 1px; cursor: pointer; border-radius: 2px; transition: all 0.15s; white-space: nowrap;
  }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar-btn.danger:hover { border-color: var(--red); color: var(--red); }
  .event-count-badge { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* ── TABLE ── */
  .table-wrap { flex: 1; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead tr { position: sticky; top: 0; z-index: 10; background: var(--bg); }
  th {
    padding: 10px 16px; text-align: left; font-family: var(--mono);
    font-size: 10px; letter-spacing: 2px; color: var(--muted);
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid rgba(30,42,58,0.5);
    transition: background 0.1s; animation: rowIn 0.2s ease both;
  }
  @keyframes rowIn { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:none} }
  tbody tr:hover { background: rgba(0,212,255,0.04); }
  td { padding: 8px 16px; vertical-align: middle; font-family: var(--mono); font-size: 12px; }
  td.col-ts    { color: var(--muted); white-space: nowrap; width: 160px; }
  td.col-agent { width: 140px; }
  td.col-type  { width: 140px; }
  td.col-data  { word-break: break-all; }

  .agent-badge {
    display: inline-block; padding: 2px 8px; border-radius: 2px;
    font-size: 11px; border: 1px solid;
  }
  .type-badge {
    display: inline-block; padding: 2px 8px; border-radius: 2px;
    font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  }
  .type-event              { background:rgba(0,212,255,0.1);   color:var(--accent);  border:1px solid rgba(0,212,255,0.2); }
  .type-agent_connected    { background:rgba(0,255,136,0.1);   color:var(--green);   border:1px solid rgba(0,255,136,0.2); }
  .type-agent_disconnected { background:rgba(255,62,94,0.1);   color:var(--red);     border:1px solid rgba(255,62,94,0.2); }
  .type-agent_status       { background:rgba(255,209,102,0.1); color:var(--yellow);  border:1px solid rgba(255,209,102,0.2); }
  .type-command_ack        { background:rgba(255,107,53,0.1);  color:var(--accent2); border:1px solid rgba(255,107,53,0.2); }
  .type-broadcast_ack      { background:rgba(199,125,255,0.1); color:#c77dff;        border:1px solid rgba(199,125,255,0.2); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; gap: 12px; color: var(--muted);
  }
  .empty-state .icon { font-size: 40px; opacity: 0.3; }
  .empty-state p { font-family: var(--mono); font-size: 13px; letter-spacing: 2px; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* toast */
  .toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 999; }
  .toast {
    padding: 10px 16px; background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); font-family: var(--mono); font-size: 12px;
    border-radius: 2px; animation: toastIn 0.2s ease, toastOut 0.3s ease 2.7s both;
    max-width: 340px;
  }
  .toast.error   { border-left-color: var(--red); }
  .toast.success { border-left-color: var(--green); }
  .toast.warn    { border-left-color: var(--yellow); }
  @keyframes toastIn  { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  @keyframes toastOut { to{opacity:0;transform:translateY(10px)} }
</style>
</head>
<body>

<header>
  <div class="logo">SYS<span>::</span>MONITOR <span style="font-size:10px;color:var(--muted)">v1.1</span></div>
  <div class="header-stats">
    <div class="stat-pill"><div class="dot green"></div><span id="agents-online">0</span>&nbsp;ONLINE</div>
    <div class="stat-pill"><div class="dot blue"></div><span id="total-events">0</span>&nbsp;EVENTOS</div>
    <div class="ws-status connecting" id="ws-status">CONECTANDO...</div>
  </div>
</header>

<div class="body-wrap">
  <aside>
    <div class="aside-title">Agentes</div>
    <div class="agent-list" id="agent-list">
      <div style="padding:20px 16px;color:var(--muted);font-family:var(--mono);font-size:11px;">Sin agentes</div>
    </div>
    <div class="broadcast-panel">
      <div class="broadcast-title">Broadcast — todos</div>
      <button class="broadcast-btn all-start" onclick="broadcastCommand('START_MONITORING')">▶ START ALL</button>
      <button class="broadcast-btn all-stop"  onclick="broadcastCommand('STOP_MONITORING')">■ STOP ALL</button>
      <button class="filter-btn" id="btn-filter" onclick="toggleFilter()">FILTRAR SELECCIONADO</button>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <input class="search-box" id="search-input" type="text" placeholder="Buscar: agente, tipo, datos..." oninput="applyFilters()">
      <button class="toolbar-btn" onclick="scrollToBottom()">↓ FIN</button>
      <button class="toolbar-btn" id="btn-autoscroll" onclick="toggleAutoScroll()">AUTO: ON</button>
      <button class="toolbar-btn danger" onclick="clearLog()">LIMPIAR</button>
      <div class="event-count-badge" id="event-count-badge">0 / 0</div>
    </div>
    <div class="table-wrap" id="table-wrap">
      <div class="empty-state" id="empty-state">
        <div class="icon">◈</div>
        <p>ESPERANDO EVENTOS...</p>
      </div>
      <table id="log-table" style="display:none">
        <thead>
          <tr>
            <th>TIMESTAMP</th>
            <th>AGENTE</th>
            <th>TIPO</th>
            <th>DATOS</th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ── Constantes ──────────────────────────────────────────────────────────────
const CMD_START = "START_MONITORING";
const CMD_STOP  = "STOP_MONITORING";
const COLORS = ['#00d4ff','#ff6b35','#00ff88','#ffd166','#c77dff','#ff9f1c','#06d6a0','#ef476f','#118ab2','#f4a261'];
let colorIdx = 0;

// ── Estado ──────────────────────────────────────────────────────────────────
const state = {
  ws: null,
  // agent_id → { online, status:"waiting"|"monitoring", count, color }
  agents: {},
  allEvents: [],
  filteredEvents: [],
  selectedAgent: null,
  filterSelected: false,
  searchQuery: '',
  autoScroll: true,
};

// ── WebSocket ────────────────────────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  state.ws = new WebSocket(`${proto}://${location.host}/ws/dashboard`);
  state.ws.onopen    = () => { setWsStatus('connected','CONECTADO'); toast('Dashboard conectado','success'); };
  state.ws.onclose   = () => { setWsStatus('disconnected','DESCONECTADO'); toast('Reconectando...','error'); setTimeout(connect,3000); };
  state.ws.onerror   = () => setWsStatus('disconnected','ERROR');
  state.ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
}

function handleMessage(msg) {
  if (msg.type === 'snapshot') {
    // agents es ahora { agent_id: "waiting"|"monitoring" }
    Object.entries(msg.agents).forEach(([id, status]) => ensureAgent(id, true, status));
    msg.events.forEach(ev => addEvent(ev, false));
    applyFilters(); renderAgentList(); return;
  }
  if (msg.type === 'agent_connected') {
    ensureAgent(msg.agent_id, true, 'waiting');
    addEvent(msg, true); renderAgentList(); updateStats();
    toast(`Agente conectado: ${msg.agent_id}`, 'success'); return;
  }
  if (msg.type === 'agent_disconnected') {
    if (state.agents[msg.agent_id]) { state.agents[msg.agent_id].online = false; state.agents[msg.agent_id].status = 'offline'; }
    addEvent(msg, true); renderAgentList(); updateStats();
    toast(`Agente desconectado: ${msg.agent_id}`, 'error'); return;
  }
  if (msg.type === 'agent_status') {
    if (state.agents[msg.agent_id]) state.agents[msg.agent_id].status = msg.status;
    addEvent(msg, true); renderAgentList(); return;
  }
  if (msg.type === 'event') {
    ensureAgent(msg.agent_id, true);
    addEvent(msg, true); return;
  }
  if (msg.type === 'command_ack') {
    addEvent(msg, true);
    const ok = msg.success;
    const label = msg.command === CMD_START ? 'START' : 'STOP';
    toast(`${label} → ${msg.agent_id}: ${ok ? 'enviado' : 'agente no disponible'}`, ok ? 'success' : 'error'); return;
  }
  if (msg.type === 'broadcast_ack') {
    addEvent(msg, true);
    const label = msg.command === CMD_START ? 'START ALL' : 'STOP ALL';
    toast(`${label}: ${msg.count} agentes alcanzados`, 'success'); return;
  }
}

// ── Agentes ──────────────────────────────────────────────────────────────────
function ensureAgent(id, online, status) {
  if (!state.agents[id]) {
    state.agents[id] = { online, status: status || 'waiting', count: 0, color: COLORS[colorIdx++ % COLORS.length] };
  } else {
    state.agents[id].online = online;
    if (status) state.agents[id].status = status;
  }
}

function renderAgentList() {
  const el = document.getElementById('agent-list');
  const ids = Object.keys(state.agents);
  if (!ids.length) {
    el.innerHTML = '<div style="padding:20px 16px;color:var(--muted);font-family:var(--mono);font-size:11px;">Sin agentes</div>';
    return;
  }
  el.innerHTML = ids.map(id => {
    const ag = state.agents[id];
    const isSelected = state.selectedAgent === id;
    const statusLabel = ag.online ? ag.status : 'offline';
    const canStart = ag.online && ag.status !== 'monitoring';
    const canStop  = ag.online && ag.status === 'monitoring';
    return `
      <div class="agent-item ${isSelected ? 'selected' : ''}" onclick="selectAgent('${id}')">
        <div class="agent-row1">
          <div class="agent-dot ${ag.online ? 'online' : 'offline'}"></div>
          <span class="agent-id" style="color:${ag.color}">${id}</span>
          <span class="agent-evcount">${ag.count}</span>
        </div>
        <div class="agent-status-bar">
          <span class="status-badge ${statusLabel}">${statusLabel}</span>
        </div>
        <div class="agent-btns">
          <button class="agent-btn start" ${canStart ? '' : 'disabled'}
            onclick="event.stopPropagation(); sendCommand('${id}', '${CMD_START}')">▶ START</button>
          <button class="agent-btn stop"  ${canStop  ? '' : 'disabled'}
            onclick="event.stopPropagation(); sendCommand('${id}', '${CMD_STOP}')">■ STOP</button>
        </div>
      </div>`;
  }).join('');
  updateStats();
}

function selectAgent(id) {
  state.selectedAgent = state.selectedAgent === id ? null : id;
  if (!state.selectedAgent) { state.filterSelected = false; document.getElementById('btn-filter').classList.remove('active'); }
  renderAgentList();
  applyFilters();
}

function toggleFilter() {
  if (!state.selectedAgent) { toast('Selecciona primero un agente', 'warn'); return; }
  state.filterSelected = !state.filterSelected;
  document.getElementById('btn-filter').classList.toggle('active', state.filterSelected);
  applyFilters();
}

// ── Comandos ──────────────────────────────────────────────────────────────────
function sendCommand(agentId, command) {
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) { toast('Sin conexión con el servidor', 'error'); return; }
  state.ws.send(JSON.stringify({ action: 'send_command', agent_id: agentId, command }));
}

function broadcastCommand(command) {
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) { toast('Sin conexión con el servidor', 'error'); return; }
  const online = Object.values(state.agents).filter(a => a.online).length;
  if (!online) { toast('No hay agentes conectados', 'warn'); return; }
  state.ws.send(JSON.stringify({ action: 'broadcast_command', command }));
}

// ── Eventos ──────────────────────────────────────────────────────────────────
function addEvent(ev, live) {
  if (state.agents[ev.agent_id]) state.agents[ev.agent_id].count++;
  state.allEvents.push(ev);
  if (state.allEvents.length > 2000) state.allEvents.splice(0, 200);

  if (live) {
    if (eventPassesFilter(ev)) {
      state.filteredEvents.push(ev);
      appendRow(ev, true);
      updateCountBadge();
    }
    if (state.autoScroll) scrollToBottom();
  }
}

function eventPassesFilter(ev) {
  if (state.filterSelected && state.selectedAgent && ev.agent_id !== state.selectedAgent) return false;
  if (state.searchQuery) {
    if (!JSON.stringify(ev).toLowerCase().includes(state.searchQuery.toLowerCase())) return false;
  }
  return true;
}

function applyFilters() {
  state.filteredEvents = state.allEvents.filter(eventPassesFilter);
  rebuildTable();
}

function rebuildTable() {
  const tbody = document.getElementById('log-body');
  tbody.innerHTML = '';
  const empty = document.getElementById('empty-state');
  const table = document.getElementById('log-table');
  if (!state.filteredEvents.length) {
    empty.style.display = 'flex'; table.style.display = 'none';
  } else {
    empty.style.display = 'none'; table.style.display = '';
    state.filteredEvents.forEach(ev => appendRow(ev, false));
  }
  updateCountBadge();
  if (state.autoScroll) scrollToBottom();
}

function appendRow(ev, animate) {
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('log-table').style.display = '';
  const tbody = document.getElementById('log-body');
  const tr = document.createElement('tr');
  const color = state.agents[ev.agent_id]?.color || '#888';

  let dataStr = '';
  if (ev.type === 'event')         dataStr = formatData(ev.data);
  else if (ev.type === 'agent_status') dataStr = `estado → ${ev.status}`;
  else if (ev.type === 'command_ack')  dataStr = `cmd:${ev.command} success:${ev.success}`;
  else if (ev.type === 'broadcast_ack')dataStr = `cmd:${ev.command} alcanzados:${ev.count} [${(ev.reached||[]).join(', ')}]`;

  tr.innerHTML = `
    <td class="col-ts">${ev.timestamp || '—'}</td>
    <td class="col-agent"><span class="agent-badge" style="color:${color};border-color:${color}30;background:${color}10">${ev.agent_id || '—'}</span></td>
    <td class="col-type"><span class="type-badge type-${ev.type}">${ev.type}</span></td>
    <td class="col-data">${escHtml(dataStr)}</td>`;
  tbody.appendChild(tr);
  if (animate) { tr.style.animation = 'rowIn 0.2s ease both'; }
}

function formatData(data) {
  if (!data) return '—';
  return typeof data === 'string' ? data : JSON.stringify(data);
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── UI ────────────────────────────────────────────────────────────────────────
function setWsStatus(cls, text) {
  const el = document.getElementById('ws-status');
  el.className = `ws-status ${cls}`; el.textContent = text;
}
function updateStats() {
  document.getElementById('agents-online').textContent = Object.values(state.agents).filter(a=>a.online).length;
  document.getElementById('total-events').textContent  = state.allEvents.length;
}
function updateCountBadge() {
  document.getElementById('event-count-badge').textContent = `${state.filteredEvents.length} / ${state.allEvents.length}`;
  updateStats();
}
function scrollToBottom() { const w = document.getElementById('table-wrap'); w.scrollTop = w.scrollHeight; }
function toggleAutoScroll() {
  state.autoScroll = !state.autoScroll;
  document.getElementById('btn-autoscroll').textContent = `AUTO: ${state.autoScroll ? 'ON' : 'OFF'}`;
}
function clearLog() {
  state.allEvents = []; state.filteredEvents = [];
  Object.values(state.agents).forEach(a => a.count = 0);
  rebuildTable(); renderAgentList(); updateCountBadge();
}
document.getElementById('search-input').addEventListener('input', e => { state.searchQuery = e.target.value; applyFilters(); });

function toast(msg, type='') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`; t.textContent = msg;
  c.appendChild(t); setTimeout(() => t.remove(), 3200);
}

connect();
</script>
</body>
</html>
